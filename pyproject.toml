[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmarks-mcp"
version = "0.2.0"
description = "FastMCP 3.3 MCP server — multi-portmanteau browser bookmark management"
authors = [{ name = "Sandra Schi" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "bookmarks", "browser", "firefox", "chrome", "edge", "brave"]
dependencies = [
  "fastmcp[apps]>=3.3.0",
  "prefab-ui>=0.18.0",
  "pydantic>=2.7",
  "aiohttp>=3.9",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "psutil>=5.9.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.14.0",
]

[project.scripts]
bookmarks-mcp = "browser_bookmarks_tools.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_bookmarks_tools"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S110", "S112"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
