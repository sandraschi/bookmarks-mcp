[project]
name = "browser-bookmarks-tools"
version = "0.1.0"
description = "FastMCP 2.13 compliant MCP server for advanced bookmark management"
authors = [{name = "Your Name"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "bookmarks", "browser", "firefox", "chrome", "ai", "organization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Utilities",
]
dependencies = [
  "mcp>=0.3.0",
  "fastmcp>=2.13",
  "pydantic>=2.7",
  "aiohttp>=3.9",
  "aiosqlite>=0.20",
  "httpx>=0.27",
]

[tool.uv]
# uv uses this file for dependency resolution

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
